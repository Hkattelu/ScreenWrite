<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1f2937" rx="20"/>
  
  <!-- Film reel circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  
  <!-- Play button (center triangle) -->
  <polygon points="40,35 40,65 65,50" fill="#3b82f6"/>
  
  <!-- Video frames on sides -->
  <rect x="20" y="30" width="12" height="12" fill="#10b981" opacity="0.8" rx="1"/>
  <rect x="20" y="45" width="12" height="12" fill="#10b981" opacity="0.6" rx="1"/>
  <rect x="20" y="60" width="12" height="12" fill="#10b981" opacity="0.4" rx="1"/>
  
  <rect x="68" y="30" width="12" height="12" fill="#f59e0b" opacity="0.8" rx="1"/>
  <rect x="68" y="45" width="12" height="12" fill="#f59e0b" opacity="0.6" rx="1"/>
  <rect x="68" y="60" width="12" height="12" fill="#f59e0b" opacity="0.4" rx="1"/>
  
  <!-- Timeline dots at bottom -->
  <circle cx="35" cy="80" r="2" fill="#8b5cf6"/>
  <circle cx="50" cy="80" r="2" fill="#8b5cf6"/>
  <circle cx="65" cy="80" r="2" fill="#8b5cf6"/>
</svg>
