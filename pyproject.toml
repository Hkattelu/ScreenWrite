[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenwrite"
version = "0.1.0"
description = "Convert markdown video scripts into DaVinci Resolve timelines with automatic B-roll fetching"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "screenwrite contributors"}
]
keywords = [
    "video",
    "davinci-resolve",
    "fcpxml",
    "markdown",
    "automation",
    "b-roll",
    "timeline"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editors",
]
dependencies = [
    "yt-dlp>=2023.11.16",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "pylint>=2.17",
    "mypy>=1.0",
]
ui = [
    "rich>=13.0.0",
]

[project.scripts]
screenwrite = "screenwrite.cli:main"

[project.urls]
Homepage = "https://github.com/Hkattelu/ScreenWrite"
Documentation = "https://github.com/Hkattelu/ScreenWrite#readme"
Repository = "https://github.com/Hkattelu/ScreenWrite.git"
"Bug Tracker" = "https://github.com/Hkattelu/ScreenWrite/issues"

[tool.setuptools]
packages = ["screenwrite"]

[tool.setuptools.package-data]
screenwrite = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["screenwrite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2